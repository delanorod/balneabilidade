name: Atualizar dados das praias

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Clona o repositório
      - name: Clonar repositório
        uses: actions/checkout@v3

      # 🔹 Instala Python
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 🔹 Instala dependências
      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 pandas lxml pdfplumber

      # 🔹 Executa seu script
      - name: Executar script
        run: |
          python gerar_json_praias.py

      # 🔥 Commit e push (sempre sobrescreve)
      - name: Commit e push seguro
        run: |
          git config --global user.name "bot-to-de-onda"
          git config --global user.email "bot@github.com"

          # garante branch correta e sincroniza sem apagar arquivos gerados
          git fetch origin
          git checkout main
          git merge origin/main --strategy-option=ours

          # adiciona arquivo atualizado
          git add praias_rj.json

          # commit sempre (mesmo sem diff de conteúdo)
          git commit --allow-empty -m "Atualização automática das praias $(date '+%Y-%m-%d %H:%M')"

          # push final
          git push origin main
